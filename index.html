    .catalog-container {

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 30px;
    }

    .product-card {
      background-color: #fff;
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-4px);
    }

    .image-wrapper {
      position: relative;
      width: 100%;
      padding-top: 125%; /* Relación de aspecto 4:5 */
      background-color: var(--surface-color);
      overflow: hidden;
    }

    .image-wrapper img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
    }

    .image-wrapper .image-main {
      opacity: 1;
      z-index: 1;
    }

    .image-wrapper .image-hover {
      opacity: 0;
      z-index: 2;
      transform: scale(1.03);
    }

    .product-card:hover .image-hover {
      opacity: 1;
      transform: scale(1);
    }

      left: 12px;

      {
        id: 29,
        title: "Camiseta Off-White Negra Logo Diagonal",
        price: "$119.900",
        category: "camisetas",
        badge: "Nuevo",
        image: "https://punto1.co/cdn/shop/files/P0004409_d4e1efd6-6b07-4f32-bab8-e2436b6a0e7b.jpg?v=1769004560&width=1445",
        image2: "https://punto1.co/cdn/shop/files/P0004410_f60943a9-079c-4797-add5-7a661dd10da4.jpg?v=1769004560&width=1445"
      },
      {
        id: 22,
        title: "Camisa Boss Azul Oscura",
        price: "$160.000",
        category: "camisas",
        badge: "Nuevo",
        image: "https://punto1.co/cdn/shop/files/50009Darkblue_3d164ed9-ba0a-4129-9dc2-9f7fede758d0.png?v=1785511788&width=1445",
        image2: "https://punto1.co/cdn/shop/files/50009Darkblueatras_02a7e83e-f849-4ca0-82ec-8904ba51de7e.png?v=1785511788&width=1445"
      }
    ];

    // Inicializar la lista filtrada con todos los productos
    currentFilteredProducts = [...products];

    // Renderizar solo los 15 productos pertenecientes a la página actual
    function renderProducts() {
      const container = document.getElementById('productGrid');
      container.innerHTML = '';

      // Calcular el rango de productos a mostrar
      const startIndex = (currentPage - 1) * PRODUCTS_PER_PAGE;
      const endIndex = startIndex + PRODUCTS_PER_PAGE;
      const paginatedItems = currentFilteredProducts.slice(startIndex, endIndex);

      paginatedItems.forEach(prod => {
        const message = encodeURIComponent(`Hola! Quisiera pedir información sobre el producto: ${prod.title} (${prod.price})`);
        const waUrl = `https://wa.me/${PHONE_NUMBER}?text=${message}`;

        const image2Html = prod.image2 
          ? `<img src="${prod.image2}" alt="${prod.title} - Vista Secundaria" class="image-hover" loading="lazy">` 
          : '';

        const cardHtml = `
          <div class="product-card">
            <div class="image-wrapper">
              ${prod.badge ? `<span class="badge">${prod.badge}</span>` : ''}
              <img src="${prod.image}" alt="${prod.title}" class="image-main" loading="lazy">
              ${image2Html}
            </div>
            <div class="product-info">
              <h3 class="product-title">${prod.title}</h3>
              <div class="product-price">${prod.price}</div>
              <a href="${waUrl}" target="_blank" class="btn-whatsapp">
                Pedir por WhatsApp
              </a>
            </div>
          </div>
        `;
        container.innerHTML += cardHtml;
      });

      renderPaginationControls();
    }

    // Dibujar los botones de paginación
    function renderPaginationControls() {
      const paginationContainer = document.getElementById('pagination');
      paginationContainer.innerHTML = '';

      const totalPages = Math.ceil(currentFilteredProducts.length / PRODUCTS_PER_PAGE);

      // Ocultar la barra de paginación si los productos no superan los 15
      if (totalPages <= 1) return;

      // Botón "Anterior"
      const prevBtn = document.createElement('button');
      prevBtn.innerText = '«';
      prevBtn.disabled = currentPage === 1;
      prevBtn.onclick = () => goToPage(currentPage - 1);
      paginationContainer.appendChild(prevBtn);

      // Botones numéricos de página
      for (let i = 1; i <= totalPages; i++) {
        const pageBtn = document.createElement('button');
        pageBtn.innerText = i;
        if (i === currentPage) pageBtn.classList.add('active');
        pageBtn.onclick = () => goToPage(i);
        paginationContainer.appendChild(pageBtn);
      }

      // Botón "Siguiente"
      const nextBtn = document.createElement('button');
      nextBtn.innerText = '»';
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.onclick = () => goToPage(currentPage + 1);
      paginationContainer.appendChild(nextBtn);
    }

    // Cambiar de página y hacer scroll suave hacia el inicio del catálogo
    function goToPage(page) {
      currentPage = page;
      renderProducts();
      document.getElementById('productGrid').scrollIntoView({ behavior: 'smooth' });
    }

    // Filtrar por categoría reseteando siempre a la página 1
    function filterCategory(cat, e) {
      const buttons = document.querySelectorAll('.nav-categories button');
      buttons.forEach(btn => btn.classList.remove('active'));
      e.target.classList.add('active');

      if (cat === 'todos') {
        currentFilteredProducts = [...products];
      } else {
        currentFilteredProducts = products.filter(p => p.category === cat);
      }

      currentPage = 1;
      renderProducts();
    }

    // Cargar productos al inicio
    renderProducts();
  </script>
</body>
